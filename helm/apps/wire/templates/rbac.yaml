apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "wire.fullname" . }}-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wire.fullname" . }}-read-pods
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "wire.fullname" . }}-pod-reader
  api_group: rbac.authorization.k8s.io