apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubernetes-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: mcp
    - port: {{ .Values.healthService.port }}
      targetPort: {{ .Values.healthService.targetPort }}
      protocol: TCP
      name: health
  selector:
    {{- include "kubernetes-mcp.selectorLabels" . | nindent 4 }}
