replicaCount: 1

image:
  repository: don-erleone
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

beamNodeSettings:
  node_name: "don_erleone"
  node_cookie: "agentic_brain_secret" # should probably be a real secret later

config:
  ollamaUrl: "http://ollama-internal.ollama.svc.cluster.local:11434/api/generate"
  ollamaModel: "qwen3.5:9b"
  subModel: "qwen3.5:9b"
  timeout: "3600000"
  subTimeout: "120000"
  mcpUrl: "http://kubernetes-mcp.infra.svc.cluster.local:30090/mcp"

# SRE Environment Variables for Nix/Erlang
env:
  RELX_REPLACE_OS_VARS: "true"
  RELX_OUT_FILE_PATH: "/tmp"
  RELEASE_MUTABLE_DIR: "/tmp"
  RELEASE_TMP: "/tmp"
  MNESIA_DIR: "/data/mnesia"
  HOME: "/data"

persistence:
  enabled: false
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /data

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi