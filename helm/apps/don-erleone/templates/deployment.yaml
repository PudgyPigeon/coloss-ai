apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "don-erleone.fullname" . }}
  labels:
    {{- include "don-erleone.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "don-erleone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "don-erleone.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          # Force Kubernetes to start in /data to prevent relative path breakage
          workingDir: {{ .Values.persistence.mountPath }}
          
          env:
            - name: OLLAMA_URL
              value: {{ .Values.config.ollamaUrl | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.config.ollamaModel | quote }}
            - name: SUB_MODEL
              value: {{ .Values.config.subModel | quote }}
            - name: TIMEOUT
              value: {{ .Values.config.timeout | quote }}
            - name: SUB_TIMEOUT
              value: {{ .Values.config.subTimeout | quote }}
            - name: MCP_URL
              value: {{ .Values.config.mcpUrl | quote }}
            
            # Map the SRE env block from values.yaml
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          volumeMounts:
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp-volume
              mountPath: /tmp
      
      volumes:
        - name: data-volume
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "don-erleone.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Critical: Provides the writable filesystem Erlang needs to boot
        - name: tmp-volume
          emptyDir: {}