apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "don-erleone.fullname" . }}
  labels:
    {{- include "don-erleone.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "don-erleone.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "don-erleone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "don-erleone.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          workingDir: {{ .Values.persistence.mountPath }}

          {{- if .Values.image.command }}
          command: {{ toYaml .Values.image.command | nindent 12 }}
          {{- end }}
          {{- if .Values.image.args }}
          args: {{ toYaml .Values.image.args | nindent 12 }}
          {{- end }}
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE_NODE
              value: "don_erleone@$(POD_NAME).{{ include "don-erleone.fullname" . }}-headless.$(NAMESPACE).svc.cluster.local"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: OLLAMA_URL
              value: {{ .Values.config.ollamaUrl | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.config.ollamaModel | quote }}
            - name: SUB_MODEL
              value: {{ .Values.config.subModel | quote }}
            - name: TIMEOUT
              value: {{ .Values.config.timeout | quote }}
            - name: SUB_TIMEOUT
              value: {{ .Values.config.subTimeout | quote }}
            - name: MCP_URL
              value: {{ .Values.config.mcpUrl | quote }}
            
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

            - name: NODE_NAME
              value: {{ .Values.beamNodeSettings.node_name | quote}}
            - name: NODE_COOKIE
              value: {{ .Values.beamNodeSettings.node_cookie | quote }}
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          volumeMounts:
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp-volume
              mountPath: /tmp
      
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data-volume
          emptyDir: {}
        {{- end }}
        - name: tmp-volume
          emptyDir: {}

  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data-volume
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
