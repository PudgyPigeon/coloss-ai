apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ollama.fullname" . }}
  labels:
    app: {{ include "ollama.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ollama.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "ollama.name" . }}
      annotations:
        {{- toYaml .Values.annotations | nindent 8 }}
    spec:
      {{- if .Values.models.pullOnStart }}
      initContainers:
      - name: model-puller
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve & 
            until ollama list >/dev/null 2>&1; do 
              echo "Waiting for local Ollama server..."
              sleep 2
            done
            {{- range .Values.models.initial }}
            echo "Pulling model: {{ . }}"
            ollama pull {{ . }}
            {{- end }}
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
      {{- end }}
      containers:
      - name: ollama
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.service.targetPort }}
          name: api
        env:
        # This prevents Ollama from trying to load multiple models 
        # and overwhelming the RAM/VRAM.
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_HOST
          value: {{ .Values.env.host | quote }}
        - name: OLLAMA_ORIGINS
          value: {{ .Values.env.origins | quote }}
        - name: OLLAMA_FLASH_ATTENTION
          value: "true"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "ollama.fullname" . }}-storage
        {{- else }}
        emptyDir: {}
        {{- end }}