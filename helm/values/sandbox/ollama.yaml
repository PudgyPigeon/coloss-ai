replicaCount: 1

fullnameOverride: "ollama-internal"

image:
  repository: ollama/ollama
  tag: latest
  pullPolicy: IfNotPresent

# Model setup
models:
  pullOnStart: true
  initial:
    # - "llama3:8b"
    # - "gemma4:e4b"
    - "qwen3.5:0.8b"
    # - "gemma4:26b"
    # - "granite-code:20b"
    # - "x/flux2-klein:9b"

# Networking
service:
  type: ClusterIP
  port: 11434
  targetPort: 11434

# Environment Configuration
env:
  host: "0.0.0.0"
  origins: "*"
  # Add these to leverage your 5080's capabilities
  extraEnv: 
    - name: OLLAMA_FLASH_ATTENTION
      value: "true"
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "5"
    - name: OLLAMA_NUM_PARALLEL
      value: "4"
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "compute,utility"

# Storage
persistence:
  enabled: true
  size: 50Gi
  accessMode: ReadWriteOnce

# Hardware Resources
resources:
  limits:
    memory: "16Gi"
    nvidia.com/gpu: 1 # Enabled: Minikube already sees this resource
  requests:
    cpu: "2"
    memory: "8Gi"
    nvidia.com/gpu: 1 # Best practice to request what you limit