# values.yaml
image:
  repository: kubernetes-mcp
  tag: latest
  pullPolicy: Always #IfNotPresent

replicaCount: 1
fullnameOverride: "kubernetes-mcp"

# http://kubernetes-mcp.kubernetes-mcp.svc.cluster.local:8080/mcp

# MCP server config (passed as CLI args / env vars)
config:
  transport: "http"         # "stdio" or "http"
  port: 8080               # MCP HTTP transport port
  healthPort: 8081         # Health/readiness probe port
  env: "dev"               # "dev", "staging", "prod"

# Service for the MCP HTTP endpoint
service:
  type: ClusterIP
  port: 8080        
  targetPort: 8080 

# Service for health probes (separate port)
healthService:
  port: 8081      
  targetPort: 8081 

# RBAC — the service account needs read access to K8s resources
rbac:
  create: true
  # ClusterRole rules for kubectl commands
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "services", "namespaces", "events"]
      verbs: ["get", "list"]
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["get", "list"]

serviceAccount:
  create: true
  name: ""  # defaults to fullname

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  limits:
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"
