[package]
name = "rig-brain"
version = "0.1.0"
edition = "2021"

[dependencies]
# The core agentic framework
rig-core = "0.34.0"

# Async runtime - essential for Rig
tokio = { version = "1.0", features = ["full"] }

# Error handling and logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# JSON handling for MCP/Tools
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Networking: Explicitly disabling default-features to avoid OpenSSL bindings,
# using rustls-tls instead. This makes cross-compilation and Alpine/scratch images significantly easier.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dotenv = "0.15"

# --- Optimization Profiles ---
# Best practice: optimize for binary size since this will run in a container image
# on your Kubernetes cluster.
[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link Time Optimization (drastically reduces binary size)
codegen-units = 1   # Maximum optimization at the cost of slower compile times
panic = "abort"     # Remove unwind tables (saves disk space)