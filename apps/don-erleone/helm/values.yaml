# Default values for don-erleone.
replicaCount: 1

image:
  repository: localhost/don-erleone # Update this to your local registry/image name
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

config:
  # Adjust this to point to the internal Ollama service in your cluster
  ollamaUrl: "http://ollama-internal.ollama.svc.cluster.local:11434/api/generate"
  ollamaModel: "qwen2.5:7b"
  subModel: "qwen2.5:1.5b"
  timeout: "3600000"
  subTimeout: "120000"

resources:
  limits:
    cpu: 500m
    memory: 512Mi