version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: swarm-ollama
    ports:
      - "11434:11434"
    volumes:
      - swarm-ollama-data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2

  ollama-puller:
    image: curlimages/curl:latest
    container_name: swarm-ollama-puller
    depends_on:
      - ollama
    entrypoint: [ "curl", "-X", "POST", "http://ollama:11434/api/pull", "-d", '{"name": "qwen3.5:0.8b"}' ]

  # --- 3. Erlang Orchestrator Backend (Nix Built - Helm Aligned) ---
  don-erleone:
    image: don-erleone:latest
    container_name: swarm-don-erleone
    hostname: don-erleone
    working_dir: /data
    depends_on:
      - ollama-puller
    environment:
      # --- Config variables aligned with Helm values.yaml ---
      - OLLAMA_URL=http://swarm-ollama:11434/api/chat
      - OLLAMA_MODEL=qwen3.5:0.8b
      - SUB_MODEL=qwen3.5:0.8b
      - TIMEOUT=3600000
      - SUB_TIMEOUT=120000
      - MCP_URL=http://swarm-kubernetes-mcp:30090/mcp
      # --- OTP/Release parameters from Helm values.yaml ---
      - RELEASE_TMP=/tmp
      - RELEASE_MUTABLE_DIR=/tmp
      - RELX_OUT_FILE_PATH=/tmp
      - RELX_REPLACE_OS_VARS=true
      - MNESIA_DIR=/data/mnesia
      - HOME=/data
      # --- Identity settings from Helm ---
      - NODE_NAME=don_erleone
      - NODE_COOKIE=agentic_brain_secret
      - RELEASE_NODE=don_erleone@don-erleone
      - RELEASE_COOKIE=agentic_brain_secret
    ports:
      - "8080:8080" # Cowboy API
      - "4369:4369" # EPMD
    volumes:
      - don-erleone-data:/data # Helm data PVC equivalent
      - don-erleone-tmp:/tmp   # Helm tmp-volume emptyDir equivalent

  # --- 4. Elixir Dashboard Frontend (Nix Built - Helm Aligned) ---
  wire:
    image: wire:latest
    container_name: swarm-wire
    hostname: wire
    ports:
      - "4000:4000" # Phoenix Web UI NodePort equivalent
    depends_on:
      - don-erleone
    environment:
      # --- Phoenix configuration from Helm ---
      - PHX_SERVER=true
      - RELEASE_COOKIE=agentic_brain_secret
      # --- Local discovery & Compose settings ---
      - RELEASE_NODE=wire@wire
      - DOCKER_COMPOSE=true
      - PORT=4000

volumes:
  swarm-ollama-data:
  don-erleone-data:
  don-erleone-tmp:
