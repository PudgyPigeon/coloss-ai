kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # This section ensures the node can talk back to Nix host
  extraMounts:
    - hostPath: /etc/hosts
      containerPath: /etc/hosts
      readOnly: true
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
    
# This tells the container runtime (containerd) to allow the local registry
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.crt".registry.configs."localhost:5001".tls]
    insecure_skip_verify = true