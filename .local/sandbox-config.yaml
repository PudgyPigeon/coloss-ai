kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      feature.node.kubernetes.io/system-os_release.ID: "ubuntu"
      feature.node.kubernetes.io/system-os_release.VERSION_ID: "22.04"
      feature.node.kubernetes.io/pci-10de.present: "true"
      nvidia.com/gpu.deploy.device-plugin: "true"
      nvidia.com/gpu.deploy.container-toolkit: "true"
    extraMounts:
      # 1. WSL2 GPU Hardware Bridge
      - hostPath: /dev/dxg
        containerPath: /dev/dxg
      - hostPath: /dev/nvidia0
        containerPath: /dev/nvidia0
      - hostPath: /dev/nvidiactl
        containerPath: /dev/nvidiactl
      - hostPath: /dev/nvidia-uvm
        containerPath: /dev/nvidia-uvm
      # 2. WSL2 GPU Libraries
      - hostPath: /usr/lib/wsl
        containerPath: /usr/lib/wsl
        readOnly: true
      # 3. Mount the NixOS Toolkit Binaries (Prevents the "No Devices" Installer Error)
      - hostPath: /usr/bin/nvidia-container-runtime
        containerPath: /usr/local/nvidia/toolkit/nvidia-container-runtime
        readOnly: true
      - hostPath: /usr/bin/nvidia-ctk
        containerPath: /usr/local/nvidia/toolkit/nvidia-ctk
        readOnly: true
      # 4. CDI Specs (Generated by your host)
      - hostPath: /etc/cdi
        containerPath: /etc/cdi
        readOnly: true
      # 5. Standard NixOS host mapping
      - hostPath: /etc/hosts
        containerPath: /etc/hosts
        readOnly: true

    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.configs."localhost:5001".tls]
      insecure_skip_verify = true
  # --- CDI Integration ---
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
      cdi_spec_dirs = ["/etc/cdi"]

